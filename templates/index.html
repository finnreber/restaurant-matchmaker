<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Decider</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="hero">
  <h1>Dinner <span>Decider</span></h1>
  <p class="sub">Two tastes. One table. Let's settle it.</p>
  <ol class="steps"><li data-s="setup" class="on">1 · Tastes</li><li data-s="vote">2 · Vote</li><li data-s="reveal">3 · Reveal</li></ol>
</header>
<main>
  <section id="setup">
    <div class="two" id="people"></div>
    <div class="opts">
      <label class="f">Area <input id="area" value="Columbus, Ohio"></label>
      <label class="f">Max distance: <b id="miv">5</b> miles <input id="mi" type="range" min="1" max="30" value="5"></label>
      <button id="near" type="button" class="b ghost">📍 Use my location</button>
      <button id="go" class="b primary">Find our restaurant</button>
      <p id="msg" class="msg" aria-live="polite"></p>
      <p id="left" class="meta"></p>
    </div>
  </section>
  <section id="vote" hidden></section>
  <section id="reveal" hidden></section>
  <p class="meta">Place data and photos from Google Maps.</p>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
